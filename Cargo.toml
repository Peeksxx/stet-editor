[package]
name = "stet"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first native terminal text editor for Windows"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security"] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[[test]]
name = "contracts"
path = "validation/contracts.rs"
