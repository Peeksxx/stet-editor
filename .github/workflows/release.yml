name: Build release installer
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'stet'
          $version = $package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag and package version do not match' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate and build
        shell: pwsh
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable build --locked --release
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is missing from the runner' }
          ./scripts/package.ps1 -Compiler $compiler -SkipBuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Stet-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/Stet-Setup-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG release/Stet-Setup-x64.exe release/SHA256SUMS.txt --verify-tag --title "Stet $env:RELEASE_VERSION" --notes '' --latest
          exit $LASTEXITCODE
