name: Build release installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Validate and build
        shell: pwsh
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable build --locked --release
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is missing from the runner' }
          ./scripts/package.ps1 -Compiler $compiler -SkipBuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Stet-1.0.0-windows-x64
          path: |
            release/Stet-Setup-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
